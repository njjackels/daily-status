<script>
const APP_KEY='daily-status-v1-data';
const seed=JSON.parse(document.getElementById('seedData').textContent);
let jobs=loadData(); let allExpanded=false;
const $=id=>document.getElementById(id); const list=$('list'), search=$('search'), client=$('client'), saveNote=$('saveNote');
function clone(v){return JSON.parse(JSON.stringify(v))} function loadData(){try{return JSON.parse(localStorage.getItem(APP_KEY))||clone(seed)}catch{return clone(seed)}}
function save(){localStorage.setItem(APP_KEY,JSON.stringify(jobs));saveNote.textContent='Saved';clearTimeout(save.timer);save.timer=setTimeout(()=>saveNote.textContent='',1200)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function searchable(j){return [j.client,j.contact,j.jobNumber,j.jobName,j.mailDelivery,j.status,j.notes,...j.tasks.flatMap(t=>[t.section,t.dateOrDone,t.task,t.component,t.supplier,t.notes])].join(' ').toLowerCase()}
function sections(tasks){const out=[];tasks.forEach(t=>{let s=out.find(x=>x.name===t.section);if(!s){s={name:t.section||'General',tasks:[]};out.push(s)}s.tasks.push(t)});return out}
function edit(path,value){let obj=jobs;path.forEach((key,i)=>{if(i===path.length-1)obj[key]=value;else obj=obj[key]});save()}
function editable(value,path,cls=''){return `<div class="editable ${cls}" contenteditable="true" spellcheck="false" data-path="${path.join('.')}">${esc(value)}</div>`}
function taskHtml(t,ji,ti){const done=String(t.dateOrDone||'').trim();return `<div class="task-row ${done?'complete':'open'}" data-ji="${ji}" data-ti="${ti}"><div><input class="date-input" data-path="${ji}.tasks.${ti}.dateOrDone" value="${esc(t.dateOrDone)}" placeholder="Add date"></div><div class="task-name">${editable(t.task,[ji,'tasks',ti,'task'])}</div><div class="component-cell">${t.component?`<span class="component-tag editable" contenteditable="true" data-path="${ji}.tasks.${ti}.component">${esc(t.component)}</span>`:editable('',[ji,'tasks',ti,'component'])}</div><div class="supplier-cell">${t.supplier?`<span class="supplier-box editable" contenteditable="true" data-path="${ji}.tasks.${ti}.supplier">${esc(t.supplier)}</span>`:editable('',[ji,'tasks',ti,'supplier'])}</div><div>${editable(t.notes,[ji,'tasks',ti,'notes'])}</div></div>`}
function jobHtml(j,ji){const detail=j.tasks.length?sections(j.tasks).map(s=>`<div class="section-title">${esc(s.name)}</div><div class="detail-head"><div>Date / Done</div><div>Status / Task</div><div>Component</div><div>Supplier</div><div>Notes</div></div>${s.tasks.map(t=>taskHtml(t,ji,j.tasks.indexOf(t))).join('')}`).join(''):'<div class="no-details">No detailed production schedule is listed for this job yet.</div>';return `<article class="job-card"><button class="job-summary" data-ji="${ji}" aria-expanded="${allExpanded}"><div class="summary-grid"><div><span class="field-label">Contact</span>${editable(j.contact,[ji,'contact'],'value')}</div><div><span class="field-label">Job #</span>${editable(j.jobNumber,[ji,'jobNumber'],'value')}</div><div><span class="field-label">Job Name</span>${editable(j.jobName,[ji,'jobName'],'value')}</div><div><span class="field-label">Mail / Delv</span>${editable(j.mailDelivery,[ji,'mailDelivery'],'value')}</div><div><span class="field-label">Status</span>${editable(j.status,[ji,'status'],'value summary-status')}</div><div><span class="field-label">Notes</span>${editable(j.notes,[ji,'notes'],'value summary-notes')}</div><div class="chevron">${allExpanded?'−':'+'}</div></div></button><div class="job-details" ${allExpanded?'':'hidden'}>${detail}</div></article>`}
function render(){const q=search.value.trim().toLowerCase(),c=client.value;const visible=jobs.map((j,i)=>({j,i})).filter(x=>(!c||x.j.client===c)&&(!q||searchable(x.j).includes(q)));const groups=new Map();visible.forEach(x=>{if(!groups.has(x.j.client))groups.set(x.j.client,[]);groups.get(x.j.client).push(x)});list.innerHTML=[...groups].map(([name,arr])=>`<section class="client-section"><h2 class="client-heading">${esc(name)}</h2>${arr.map(x=>jobHtml(x.j,x.i)).join('')}</section>`).join('');$('empty').hidden=visible.length>0;$('jobCount').textContent=visible.length;$('clientCount').textContent=groups.size;$('detailCount').textContent=visible.filter(x=>x.j.tasks.length).length;bind()}
function bind(){document.querySelectorAll('.job-summary').forEach(b=>b.addEventListener('click',e=>{if(e.target.closest('[contenteditable]'))return;const d=b.nextElementSibling,open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!open));d.hidden=open;b.querySelector('.chevron').textContent=open?'+':'−'}));document.querySelectorAll('[contenteditable][data-path]').forEach(el=>{el.addEventListener('click',e=>e.stopPropagation());el.addEventListener('blur',()=>{const p=el.dataset.path.split('.').map(x=>/^\d+$/.test(x)?Number(x):x);edit(p,el.textContent.trim())});el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}})});document.querySelectorAll('.date-input').forEach(inp=>{inp.addEventListener('click',e=>e.stopPropagation());const apply=()=>{const p=inp.dataset.path.split('.').map(x=>/^\d+$/.test(x)?Number(x):x);edit(p,inp.value.trim());const row=inp.closest('.task-row'),done=!!inp.value.trim();row.classList.toggle('complete',done);row.classList.toggle('open',!done)};inp.addEventListener('change',apply);inp.addEventListener('blur',apply);inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur()})})}
function fillClients(){[...new Set(jobs.map(j=>j.client))].sort().forEach(c=>client.insertAdjacentHTML('beforeend',`<option value="${esc(c)}">${esc(c)}</option>`))}
search.addEventListener('input',render);client.addEventListener('change',render);$('expandAll').addEventListener('click',()=>{allExpanded=!allExpanded;$('expandAll').textContent=allExpanded?'Collapse all':'Expand all';render()});
$('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),jobs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Daily_Status_Backup.json';a.click();URL.revokeObjectURL(a.href)});
$('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.jobs))throw Error();jobs=d.jobs;save();location.reload()}catch{alert('That backup file could not be read.')}e.target.value=''});
fillClients();render();
</script>
